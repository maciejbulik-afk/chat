name: Build Windows
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zaleznosci frontendowych
        run: npm install

      - name: Instalacja środowiska Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Kompilacja Tauri (Tworzenie MSI)
        run: npm run tauri build

      - name: Upload instalatora NSIS
        uses: actions/upload-artifact@v4
        with:
          name: Google-Chat-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe