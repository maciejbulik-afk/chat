name: Build
on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zaleznosci frontendowych
        run: npm install

      - name: Instalacja środowiska Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Kompilacja Tauri
        run: npm run tauri build -- --bundles nsis

      - name: Upload instalatora NSIS
        uses: actions/upload-artifact@v4
        with:
          name: Google-Chat-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja zaleznosci systemowych
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev rpm

      - name: Instalacja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zaleznosci frontendowych
        run: npm install

      - name: Instalacja środowiska Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Kompilacja Tauri
        run: npm run tauri build -- --bundles appimage,rpm

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Google-Chat-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: Google-Chat-Linux-RPM
          path: src-tauri/target/release/bundle/rpm/*.rpm
