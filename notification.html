<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      height: 100vh;
      background: var(--bg);
      cursor: pointer;
      user-select: none;
    }
    .notification {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 100%;
      padding: 0 16px;
      border-left: 4px solid var(--accent);
      animation: pulse-bg 2s ease-in-out infinite;
      position: relative;
    }
    .icon {
      flex-shrink: 0;
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      animation: pulse-icon 2s ease-in-out infinite;
    }
    .text { flex: 1; min-width: 0; }
    .title {
      font-weight: 700;
      font-size: 13px;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subtitle { font-size: 10px; color: var(--fg-dim); margin-top: 1px; }
    .close-btn {
      position: absolute;
      top: 4px; right: 6px;
      width: 18px; height: 18px;
      border: none;
      background: rgba(128,128,128,0.2);
      color: var(--fg-dim);
      font-size: 12px;
      line-height: 18px;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      padding: 0;
    }
    .close-btn:hover { background: rgba(128,128,128,0.4); color: var(--fg); }
    @keyframes pulse-bg {
      0%, 100% { background: color-mix(in srgb, var(--accent) 8%, transparent); }
      50% { background: color-mix(in srgb, var(--accent) 15%, transparent); }
    }
    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    /* Accent themes */
    :root { --accent: #e74c3c; --bg: #1a1a2e; --fg: #fff; --fg-dim: #888; }
    body.theme-red    { --accent: #e74c3c; }
    body.theme-blue   { --accent: #3498db; }
    body.theme-green  { --accent: #2ecc71; }
    body.theme-purple { --accent: #9b59b6; }
    body.theme-orange { --accent: #e67e22; }
    body.theme-cyan   { --accent: #00bcd4; }
    /* Background themes */
    body.bg-dark      { --bg: #1a1a2e; --fg: #fff; --fg-dim: #888; }
    body.bg-darker    { --bg: #0d0d1a; --fg: #e0e0e0; --fg-dim: #666; }
    body.bg-charcoal  { --bg: #2d2d2d; --fg: #fff; --fg-dim: #999; }
    body.bg-midnight  { --bg: #1a1a3e; --fg: #e8e8ff; --fg-dim: #7777aa; }
    body.bg-light     { --bg: #f0f0f0; --fg: #222; --fg-dim: #666; }
    body.bg-white     { --bg: #ffffff; --fg: #111; --fg-dim: #888; }
    body.bg-red       { --bg: #2e1a1a; --fg: #ffdddd; --fg-dim: #aa7777; }
    body.bg-green     { --bg: #1a2e1a; --fg: #ddffdd; --fg-dim: #77aa77; }
    body.bg-yellow    { --bg: #2e2e1a; --fg: #ffffdd; --fg-dim: #aaaa77; }
  </style>
</head>
<body>
  <div class="notification" id="notif-body">
    <div class="icon">💬</div>
    <div class="text">
      <div class="title" id="notif-title">Nowa wiadomość</div>
      <div class="subtitle">Kliknij aby otworzyć czat</div>
    </div>
    <button class="close-btn" id="close-btn" title="Zamknij">✕</button>
  </div>
  <script type="module">
    import { getCurrentWindow } from '@tauri-apps/api/window';
    const { invoke } = window.__TAURI__.core;
    const win = getCurrentWindow();

    const params = new URLSearchParams(window.location.search);
    const theme = params.get('theme') || 'red';
    const bg = params.get('bg') || 'dark';

    // Ustaw klasy
    const classes = [];
    if (theme !== 'custom') classes.push('theme-' + theme);
    if (bg !== 'custom') classes.push('bg-' + bg);
    document.body.className = classes.join(' ');

    // Custom kolory przez CSS variables
    if (theme === 'custom') {
      const ct = params.get('ct') || '#e74c3c';
      document.documentElement.style.setProperty('--accent', ct);
    }
    if (bg === 'custom') {
      const cb = params.get('cb') || '#1a1a2e';
      document.documentElement.style.setProperty('--bg', cb);
      // Auto-detect fg color based on bg luminance
      const r = parseInt(cb.slice(1,3), 16), g = parseInt(cb.slice(3,5), 16), b2 = parseInt(cb.slice(5,7), 16);
      const lum = (0.299*r + 0.587*g + 0.114*b2) / 255;
      if (lum > 0.5) {
        document.documentElement.style.setProperty('--fg', '#111');
        document.documentElement.style.setProperty('--fg-dim', '#666');
      } else {
        document.documentElement.style.setProperty('--fg', '#fff');
        document.documentElement.style.setProperty('--fg-dim', '#888');
      }
    }

    (async () => {
      try {
        const t = await win.title();
        if (t && t !== 'Notification') {
          document.getElementById('notif-title').textContent = t;
        }
      } catch(e) {}
    })();

    document.getElementById('notif-body').addEventListener('click', async (e) => {
      if (e.target.id === 'close-btn') return;
      try {
        await invoke('show_main_window');
        await win.close();
      } catch(e) {}
    });

    document.getElementById('close-btn').addEventListener('click', async (e) => {
      e.stopPropagation();
      try { await win.close(); } catch(e) {}
    });
  </script>
</body>
</html>
