<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
        display: flex;
        align-items: center;
        height: 100vh;
        background: #1a1a2e;
        cursor: pointer;
        user-select: none;
      }
      .notification {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        height: 100%;
        padding: 0 20px;
        border-left: 4px solid #e74c3c;
        animation: pulse-bg 2s ease-in-out infinite;
      }
      .icon {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        background: #e74c3c;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        animation: pulse-icon 2s ease-in-out infinite;
      }
      .text {
        flex: 1;
        min-width: 0;
      }
      .title {
        font-weight: 700;
        font-size: 14px;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .subtitle {
        font-size: 11px;
        color: #888;
        margin-top: 2px;
      }
      @keyframes pulse-bg {
        0%, 100% { background: rgba(231, 76, 60, 0.08); }
        50% { background: rgba(231, 76, 60, 0.15); }
      }
      @keyframes pulse-icon {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
    </style>
  </head>
  <body>
    <div class="notification">
      <div class="icon">💬</div>
      <div class="text">
        <div class="title" id="notif-title">Nowa wiadomość</div>
        <div class="subtitle">Kliknij aby otworzyć</div>
      </div>
    </div>
    <script type="module">
      import { getCurrentWindow } from '@tauri-apps/api/window';
      
      // Wyswietl nazwe nadawcy z tytulu okna
      const win = getCurrentWindow();
      try {
        const t = await win.title();
        if (t && t !== 'Notification') {
          document.getElementById('notif-title').textContent = t;
        }
      } catch(e) {}

      document.body.addEventListener('click', async () => {
        try { await win.close(); } catch(e) {}
      });
    </script>
  </body>
</html>
